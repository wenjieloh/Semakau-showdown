<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Semakau Showdown — Jeopardy-style plastic waste quiz about Singapore's Pulau Semakau landfill."/>
<title>Semakau Showdown</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♻️</text></svg>"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at top,#0d2b3e 0%,#061826 60%,#04101c 100%);color:#fff;min-height:100vh;overflow-x:hidden}
button{font-family:inherit}
/* MODE SELECT */
.mode-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.mode-box{background:linear-gradient(180deg,#122e42,#081b2a);border:2px solid #1d9e75;border-radius:20px;padding:2rem;width:100%;max-width:640px;text-align:center;animation:modalPop .5s cubic-bezier(.34,1.56,.64,1)}
.mode-logo{font-size:52px;margin-bottom:.5rem;display:inline-block;animation:bob 2s ease-in-out infinite}
.mode-title{font-size:clamp(22px,5vw,32px);font-weight:800;color:#ffd23f;text-transform:uppercase;text-shadow:0 0 10px rgba(255,210,63,.5);margin-bottom:6px}
.mode-sub{font-size:13px;color:#9fd8c4;margin-bottom:1rem}
.mode-lang-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1.25rem}
.mode-lang-row select{background:#0e2738;color:#fff;border:2px solid #2563eb33;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.mode-cards{grid-template-columns:1fr}}
.mode-card{background:#0e2738;border:2px solid #2563eb33;border-radius:14px;padding:1.25rem;cursor:pointer;text-align:left;transition:all .2s;color:#fff}
.mode-card:hover{border-color:#ffd23f;transform:translateY(-4px);box-shadow:0 8px 24px rgba(255,210,63,.2)}
.mode-card:focus{outline:3px solid #ffd23f;outline-offset:3px}
.mode-card-icon{font-size:30px;margin-bottom:10px}
.mode-card-title{font-size:15px;font-weight:800;color:#ffd23f;margin-bottom:6px}
.mode-card-desc{font-size:12px;color:#9fd8c4;line-height:1.55}
/* LAYOUT */
.wrap{max-width:980px;margin:0 auto;padding:1.5rem}
@media(max-width:768px){.wrap{padding:1rem}}
/* HERO */
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:1rem}
.hero{text-align:center;flex:1;animation:dropIn .6s ease}
.hero h1{font-size:clamp(20px,4vw,34px);font-weight:800;letter-spacing:1px;color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.6),0 0 24px rgba(255,210,63,.3);text-transform:uppercase}
.hero p{color:#9fd8c4;font-size:clamp(12px,2vw,14px);margin-top:6px}
.top-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn,.top-controls select{background:#0e2738;color:#fff;border:2px solid #2563eb33;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;transition:border-color .2s,transform .15s}
.top-controls select{padding:8px 10px;font-size:13px}
.icon-btn:hover,.top-controls select:hover{border-color:#ffd23f}
.icon-btn:hover{transform:scale(1.1)}
.icon-btn:focus,.top-controls select:focus{outline:3px solid #ffd23f;outline-offset:3px}
/* HOW TO PLAY */
.help-panel{background:#0e2738;border:2px solid #1d9e75;border-radius:14px;margin-bottom:1.25rem;animation:fadeSlideUp .3s ease}
.help-inner{padding:1.25rem;font-size:13px;line-height:1.7;color:#d7f5e8}
.help-inner h3{color:#ffd23f;font-size:15px;margin-bottom:10px}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.help-grid{grid-template-columns:1fr}}
.help-section{background:#122e42;border-radius:10px;padding:10px 12px}
.help-section strong{color:#4ade80;display:block;margin-bottom:4px}
/* MASCOT */
.mascot-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 1.25rem;flex-wrap:wrap}
.mascot-face{font-size:40px;animation:bob 2s ease-in-out infinite}
.mascot-face.react-happy{animation:happyBounce .5s ease}
.mascot-face.react-sad{animation:sadShake .5s ease}
.mascot-speech{background:#102a3a;border:2px solid #1d9e75;border-radius:16px;padding:10px 16px;font-size:13px;max-width:480px;color:#d7f5e8;position:relative;animation:fadeSlideIn .4s ease}
.mascot-speech::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#1d9e75}
/* ISLAND */
.island-section{text-align:center;margin-bottom:1.5rem}
.island-label{font-size:13px;color:#9fd8c4;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.island-stage{width:280px;max-width:100%;height:180px;margin:0 auto;position:relative}
.island-stage svg{width:100%;height:100%}
.damage-bar-track{width:260px;max-width:100%;height:12px;background:#0a2538;border-radius:8px;margin:10px auto 6px;overflow:hidden;border:1px solid #1a2c3a}
.damage-bar-fill{height:100%;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444);width:0%;transition:width .5s ease}
.damage-text{font-size:12px;color:#9fd8c4;transition:color .3s}
.trash-particle{position:absolute;font-size:16px;opacity:0;pointer-events:none}
@keyframes trashFall{0%{opacity:0;transform:translateY(-20px) rotate(0deg)}20%{opacity:1}100%{opacity:.9;transform:translateY(40px) rotate(180deg)}}
.island-shake{animation:islandShake .4s}
/* SCOREBOARD */
.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.score-card{background:linear-gradient(180deg,#14344a,#0c2335);border:2px solid #1d4e63;border-radius:14px;padding:14px;text-align:center;transition:all .25s}
.score-card.active{border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.4);transform:translateY(-4px)}
.team-name{font-size:clamp(10px,2vw,12px);color:#8fb8cc;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.team-score{font-size:clamp(22px,4vw,30px);font-weight:800;transition:transform .2s}
.team-score.pop{animation:scorePop .4s ease}
.team-badge{display:inline-block;font-size:clamp(9px,1.5vw,10px);padding:3px 10px;border-radius:20px;margin-top:6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.solo-score-bar{background:linear-gradient(180deg,#14344a,#0c2335);border:2px solid #1d9e75;border-radius:14px;padding:16px;text-align:center;margin-bottom:1.5rem}
.solo-score-label{font-size:12px;color:#8fb8cc;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.solo-score-value{font-size:36px;font-weight:800;color:#ffd23f}
.solo-score-sub{font-size:12px;color:#9fd8c4;margin-top:4px}
.turn-indicator{text-align:center;font-size:clamp(12px,2.5vw,14px);color:#ffd23f;margin-bottom:1.25rem;font-weight:600}
/* BOARD */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem}
@media(max-width:600px){.board{gap:5px}}
.cat-header{background:linear-gradient(180deg,#1d9e75,#0f6e56);border-radius:10px;padding:12px 6px;text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid #2bc492;animation:dropIn .5s ease}
.cat-icon{font-size:clamp(16px,3vw,20px)}
.cat-name{font-size:clamp(9px,1.5vw,11px);font-weight:700;color:#eafff5;line-height:1.25;text-transform:uppercase;letter-spacing:.3px}
.cell{background:linear-gradient(180deg,#133a52,#0a2538);border:2px solid #2563eb33;border-radius:10px;text-align:center;cursor:pointer;font-size:clamp(16px,3vw,20px);font-weight:800;color:#ffd23f;min-height:clamp(44px,8vw,56px);display:flex;align-items:center;justify-content:center;transition:all .15s;animation:tilePop .35s ease backwards;-webkit-appearance:none;appearance:none}
.cell:nth-child(4n+1){animation-delay:.02s}.cell:nth-child(4n+2){animation-delay:.06s}.cell:nth-child(4n+3){animation-delay:.10s}.cell:nth-child(4n+4){animation-delay:.14s}
.cell:hover:not([disabled]){background:linear-gradient(180deg,#1c4d6c,#0f3047);border-color:#ffd23f;transform:scale(1.06);box-shadow:0 4px 12px rgba(255,210,63,.25)}
.cell:focus{outline:3px solid #ffd23f;outline-offset:3px}
.cell:active:not([disabled]){transform:scale(.95)}
.cell.used{background:#0a1722;color:#355068;border-color:#1a2c3a;cursor:default;font-size:22px;animation:usedFlip .5s ease}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(2,8,14,.8);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;animation:overlayFade .25s ease}
.modal{background:linear-gradient(180deg,#122e42,#081b2a);border-radius:18px;border:2px solid #1d9e75;width:100%;max-width:600px;padding:1.75rem;box-shadow:0 0 40px rgba(29,158,117,.25);animation:modalPop .35s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto}
@media(max-width:480px){.modal{padding:1.25rem}}
.modal-tag{font-size:11px;color:#6fb8d4;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.modal-pts{font-size:15px;font-weight:800;color:#ffd23f;margin-bottom:14px}
.modal-question{font-size:clamp(14px,2.5vw,17px);font-weight:700;color:#fff;line-height:1.5;margin-bottom:1.25rem}
.timer-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.timer-track{flex:1;height:8px;background:#0a2538;border-radius:6px;overflow:hidden}
.timer-fill{height:100%;background:#4ade80;border-radius:6px;transition:width 1s linear,background .4s}
.timer-fill.warn{background:#facc15}
.timer-fill.danger{background:#f87171}
.timer-label{font-size:13px;font-weight:800;color:#ffd23f;min-width:36px;text-align:right}
.timer-label.danger{color:#f87171;animation:pulse .4s infinite}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.options.opts-triple{grid-template-columns:1fr}
@media(max-width:420px){.options{grid-template-columns:1fr}}
.opt-btn{background:#0e2738;border:2px solid #2563eb33;border-radius:10px;padding:14px;text-align:left;font-size:clamp(12px,2vw,13px);color:#e8f4fa;cursor:pointer;line-height:1.4;font-weight:600;transition:all .15s;width:100%}
.opt-btn:hover:not([disabled]){background:#15334a;border-color:#ffd23f;transform:translateY(-2px)}
.opt-btn:focus{outline:3px solid #ffd23f;outline-offset:3px}
.opt-btn:active:not([disabled]){transform:scale(.97)}
.opt-btn.correct{background:#163d24;border-color:#4ade80;color:#bbf7d0;animation:correctPulse .5s ease}
.opt-btn.wrong{background:#3d1616;border-color:#f87171;color:#fecaca;animation:wrongShake .4s ease}
.result-box{border-radius:12px;padding:14px;font-size:13px;line-height:1.6;margin-bottom:1rem;animation:fadeSlideUp .4s ease}
.result-box.correct{background:#163d24;color:#bbf7d0;border:1px solid #4ade80}
.result-box.wrong{background:#3d1616;color:#fecaca;border:1px solid #f87171}
.result-box.trick{background:#3d3416;color:#fde68a;border:1px solid #facc15}
.fact-tag{display:inline-block;font-size:10px;font-weight:700;color:#0a1722;background:#ffd23f;padding:2px 8px;border-radius:6px;margin-bottom:6px;text-transform:uppercase}
.mascot-react{display:flex;align-items:center;gap:10px;margin-bottom:1rem;animation:fadeSlideUp .4s ease}
.mascot-react .mface{font-size:28px}
.mascot-react .mtext{font-size:12px;color:#9fd8c4;font-style:italic}
.modal-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.team-select{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.team-btn{font-size:12px;padding:6px 12px;border-radius:8px;border:2px solid #2563eb33;background:#0e2738;color:#e8f4fa;cursor:pointer;font-weight:600;transition:all .15s}
.team-btn:hover{transform:scale(1.05);border-color:#ffd23f}
.team-btn:focus{outline:3px solid #ffd23f;outline-offset:3px}
.team-btn.selected{background:#ffd23f;border-color:#ffd23f;color:#0a1722}
.close-btn{font-size:13px;padding:8px 16px;border-radius:10px;border:2px solid #2563eb33;background:transparent;color:#cdd;cursor:pointer;font-weight:600;transition:all .15s}
.close-btn:hover{border-color:#f87171;color:#fecaca}
.close-btn:focus{outline:3px solid #ffd23f;outline-offset:3px}
.award-btn{font-size:13px;padding:8px 18px;border-radius:10px;border:2px solid #1d9e75;background:#1d9e75;color:#04342c;cursor:pointer;font-weight:800;transition:all .15s}
.award-btn:hover{transform:scale(1.05);box-shadow:0 0 14px rgba(29,158,117,.5)}
.award-btn:focus{outline:3px solid #ffd23f;outline-offset:3px}
.win-banner{text-align:center;font-size:clamp(16px,3vw,22px);font-weight:800;padding:1.5rem;background:linear-gradient(180deg,#1d4e63,#0c2335);border-radius:16px;border:2px solid #ffd23f;color:#ffd23f;margin-top:1rem;text-shadow:0 0 12px rgba(255,210,63,.5);animation:modalPop .5s cubic-bezier(.34,1.56,.64,1)}
.loss-banner{text-align:center;font-size:clamp(16px,3vw,22px);font-weight:800;padding:1.5rem;background:linear-gradient(180deg,#3d1616,#1a0808);border-radius:16px;border:2px solid #f87171;color:#f87171;margin-top:1rem;animation:modalPop .5s cubic-bezier(.34,1.56,.64,1)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.25rem}
.restart-btn{background:#1d9e75;color:#04342c;border:none;border-radius:10px;padding:12px 24px;font-weight:800;cursor:pointer;font-size:14px;transition:transform .15s}
.restart-btn:hover{transform:scale(1.05)}
.restart-btn:focus{outline:3px solid #ffd23f;outline-offset:3px}
/* BONUS ROUND */
.bonus-modal{background:repeating-linear-gradient(135deg,#2a2204,#2a2204 14px,#1a1502 14px,#1a1502 28px);border:3px solid #ffd23f;box-shadow:0 0 60px rgba(255,210,63,.5);animation:modalPop .4s cubic-bezier(.34,1.56,.64,1)}
.bonus-header{text-align:center;margin-bottom:1rem}
.bonus-title{font-size:clamp(14px,3vw,20px);font-weight:900;color:#ffd23f;text-transform:uppercase;letter-spacing:1px;animation:pulse .8s infinite}
.bonus-warning{font-size:12px;color:#fde68a;margin-top:4px}
.bonus-timer{font-size:clamp(36px,8vw,48px);font-weight:900;text-align:center;color:#ffd23f;margin:.5rem 0;text-shadow:0 0 20px rgba(255,210,63,.7);transition:color .3s}
.bonus-timer.danger{color:#f87171;text-shadow:0 0 20px rgba(248,113,113,.8);animation:pulse .4s infinite}
.bonus-opt-btn{background:#1a1502;border:2px solid #ffd23f55;border-radius:10px;padding:14px;text-align:left;font-size:13px;color:#fde68a;cursor:pointer;line-height:1.4;font-weight:600;width:100%;transition:all .15s;margin-bottom:8px}
.bonus-opt-btn:hover:not([disabled]){background:#2a2204;border-color:#ffd23f;transform:translateY(-2px)}
.bonus-opt-btn:focus{outline:3px solid #ffd23f;outline-offset:3px}
.bonus-progress{display:flex;gap:6px;justify-content:center;margin:10px 0}
.bonus-dot{width:10px;height:10px;border-radius:50%;background:#4a3a08;transition:all .3s}
.bonus-dot.done{background:#4ade80}
.bonus-dot.current{background:#ffd23f;animation:pulse .6s infinite}
/* TRANSITIONS */
.freeze-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
.freeze-text{font-size:clamp(20px,5vw,28px);font-weight:900;color:#fff;text-align:center;text-transform:uppercase;animation:freezeZoom 1s ease;text-shadow:0 0 20px rgba(255,255,255,.4)}
.alarm-overlay{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;animation:alarmFlash .4s infinite alternate}
.alarm-content{text-align:center}
.alarm-title{font-size:clamp(18px,4vw,30px);font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 24px rgba(255,255,255,.6);animation:alarmPulse .5s infinite}
.alarm-count{font-size:clamp(60px,15vw,90px);font-weight:900;color:#fff;margin-top:1rem;text-shadow:0 0 30px rgba(255,255,255,.8);animation:countPop 1s ease}
/* STATS */
.stats-screen{background:linear-gradient(180deg,#14344a,#0c2335);border:2px solid #ffd23f;border-radius:16px;padding:1.5rem;margin-top:1.5rem;animation:modalPop .5s ease}
.stats-title{text-align:center;font-size:clamp(16px,3vw,22px);font-weight:800;color:#ffd23f;margin-bottom:1.25rem;text-transform:uppercase}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.25rem}
@media(max-width:500px){.stats-grid{grid-template-columns:1fr}}
.stat-team-card{background:#0c2335;border:2px solid #1d4e63;border-radius:12px;padding:12px;text-align:center;transition:transform .2s}
.stat-team-card:hover{transform:translateY(-3px)}
.stat-team-card.winner{border-color:#ffd23f;box-shadow:0 0 16px rgba(255,210,63,.35)}
.stat-team-name{font-size:13px;font-weight:700;margin-bottom:8px}
.stat-row{display:flex;justify-content:space-between;font-size:11px;color:#9fd8c4;padding:3px 0}
.stat-row span:last-child{color:#fff;font-weight:700}
.overall-stats{background:#0c2335;border-radius:12px;padding:14px;font-size:13px;line-height:1.8}
.overall-stats .row{display:flex;justify-content:space-between;border-bottom:1px solid #1a2c3a;padding:6px 0}
.mvp-banner{text-align:center;background:#1d4e63;border-radius:10px;padding:10px;margin-bottom:1rem;font-size:13px;color:#ffd23f;font-weight:700}
.breakdown-section{margin-top:.5rem}
.breakdown-list{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:.5rem;padding-right:4px}
.breakdown-item{border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;border:1px solid #1d4e63;background:#0c2335}
.breakdown-item.bi-correct{border-color:#2f6b46}
.breakdown-item.bi-wrong{border-color:#6b3232}
.bi-head{font-size:11px;color:#9fd8c4;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.bi-q{color:#e8f4fa;margin-bottom:4px;font-weight:600}
.bi-a{color:#cdd}
.bi-correct-answer{color:#4ade80;margin-top:2px}
/* CONFETTI */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;width:8px;height:14px;opacity:.9;border-radius:2px;animation:confettiFall linear forwards}
/* KEYFRAMES */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes happyBounce{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1)}}
@keyframes sadShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-5deg)}75%{transform:translateX(6px) rotate(5deg)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes tilePop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes usedFlip{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes overlayFade{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.04);box-shadow:0 0 16px rgba(74,222,128,.5)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes islandShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes freezeZoom{0%{transform:scale(1.3);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes alarmFlash{from{background:rgba(180,20,20,.6)}to{background:rgba(255,210,63,.5)}}
@keyframes alarmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes countPop{0%{transform:scale(2);opacity:0}50%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

{q:"Buying apples pre-packed in a plastic bag with a foam tray vs picking loose apples into your own basket — which has a higher plastic packaging footprint?",opts:["Loose apples","Pre-packed apples"],correct:1,fact:"Pre-packed fruit adds a plastic bag and a foam tray on top of food that did not need either. That is two separate waste streams for the price of one apple.",mascot:"Fruit does not need a costume."},
{q:"A glass jar of jam vs a plastic squeeze bottle of the same size — assuming neither is recycled and both are eventually thrown away, which one is generally considered more resource-intensive to manufacture in the first place?",opts:["Plastic squeeze bottle","Glass jar"],correct:1,fact:"Glass is heavier and requires significantly more energy to produce and transport than plastic, even though plastic pollution tends to be more visible and long-lasting once discarded. Manufacturing footprint and disposal impact are two separate questions, which is why comparisons like this are rarely as simple as they first appear.",mascot:"Nothing is entirely free of impact, including the usual alternatives to plastic."},
{q:"Which of the following supermarket packaging materials is generally the HARDEST for Singapore's recycling facilities to process, even when clean?",opts:["Clear PET bottle","Aluminium can","Thin cling film (LDPE)"],correct:2,fact:"Thin plastic film such as cling wrap tends to jam sorting machinery and is rejected by most recycling facilities, unlike rigid PET bottles or aluminium cans, which are comparatively straightforward to sort and process.",mascot:"Thin plastic film causes more trouble than its size would suggest."},
{q:"Singapore's overall recycling rate for plastic waste is closest to which of these figures?",opts:["6%","25%","15%","1%"],correct:0,fact:"Singapore recycles only around 6% of the plastic waste it generates, largely because most plastic is contaminated with food or mixed with other materials, making it uneconomical to sort and reprocess.",mascot:"Most people guess a higher number than the real one."}
],
[
{q:"Ordering bubble tea with the 'no cutlery needed' option switched on vs left off — which generates more immediate plastic waste?",opts:["Option switched on (no cutlery)","Option left off (cutlery included)"],correct:1,fact:"Leaving that option off automatically adds a straw and utensils you may not even need. A single tap in the app can reduce real plastic waste with every order.",mascot:"One small setting can mean one less straw for me to deal with."},
{q:"Ordering a small item online, packed with a polymailer and bubble wrap, vs buying the same item from a physical store — which generates more shipping-related plastic waste?",opts:["Online order with packaging","Buying in-store"],correct:0,fact:"Online orders often stack polymailers, bubble wrap, and tape — layers of plastic that a straightforward in-store purchase skips entirely.",mascot:"A single phone case rarely needs that much bubble wrap."},
{q:"You order three items from the same online store at the same time. Which delivery approach usually produces less total packaging waste?",opts:["The retailer ships each item separately as soon as it's ready","The retailer consolidates all three items into one parcel"],correct:1,fact:"Consolidated shipping means fewer boxes, less tape, and fewer air pillows overall, even though shipping items as soon as they're ready can sometimes feel faster to the customer.",mascot:"Waiting a little longer for one parcel is often better than three arriving separately."},
{q:"Which packaging material commonly used in e-commerce shipping is generally the most difficult to recycle in Singapore?",opts:["Corrugated cardboard box","Plastic air pillows or bubble wrap","Paper-based tape"],correct:1,fact:"Plastic air pillows and bubble wrap are thin, mixed-material film that most facilities cannot process, unlike cardboard, which has an established recycling stream in Singapore.",mascot:"Cardboard has a clear path forward. This kind of plastic mostly does not."},
{q:"A week of daily food delivery, at roughly 4 disposable plastic items per order (container, lid, bag, cutlery pack), adds up to about how many separate plastic items in total for one person?",opts:["14","28","7","21"],correct:1,fact:"Seven days of delivery, at roughly four disposable items per order, adds up to around 28 separate pieces of plastic in a single week for one person.",mascot:"It adds up faster than most people expect."}
],
[
{q:"Drinking imported bottled mineral water every day vs drinking from a reusable flask — which generates more PET bottle waste?",opts:["Bottled mineral water","Reusable flask"],correct:0,fact:"One bottle a day adds up to more than 300 PET bottles a year per person. Singapore's tap water is safe to drink, so a flask avoids this waste entirely.",mascot:"That adds up to 365 bottles a year for water that comes free from the tap."},
{q:"Using disposable plastic wet wipes to clean your hands vs washing with soap and water — which generates more plastic microfibre waste?",opts:["Soap and water","Disposable wet wipes"],correct:1,fact:"Most wet wipes are woven from plastic fibres such as polyester, so they do not biodegrade. They are, in effect, plastic waste disguised as tissue.",mascot:"Wet wipes look soft, but many of them are plastic in disguise."},
{q:"A biodegradable-labelled plastic bag vs a standard plastic bag, both used to line your household bin — assuming both end up incinerated in Singapore as normal household trash, which one still leaves plastic-derived ash residue behind?",opts:["Both do, more or less equally","Only the standard plastic bag does"],correct:0,fact:"Almost all household waste in Singapore is incinerated before disposal, and both types of bags leave ash residue afterward. A biodegradable label matters far more in a composting environment than in an incinerator, so within Singapore's system, the difference between the two is smaller than most people assume.",mascot:"A label alone does not decide where something ends up. The system it passes through does."},
{q:"Which everyday habit generally produces the LEAST plastic waste over a full year for one person?",opts:["Buying a new umbrella once and reusing it for years","Buying a disposable rain poncho every time it rains unexpectedly","Buying a new umbrella every year regardless of condition"],correct:0,fact:"A single durable umbrella reused for years produces far less plastic waste over time than either replacing it annually or repeatedly buying single-use ponchos.",mascot:"The item you keep the longest is usually the one that matters least to a landfill."},
{q:"Roughly what percentage of Singapore's overall solid waste volume is eliminated through incineration before what remains is sent to Semakau?",opts:["Around 30%","Around 50%","Around 90%","Around 70%"],correct:2,fact:"Incineration reduces the volume of Singapore's waste by up to around 90%, though the resulting ash still needs to be disposed of, and that is what ultimately travels to Semakau.",mascot:"Even after burning, something is always left over for me."}
]
],
zh:[
[
{q:"用塑料容器打包外带食物，还是堂食使用可重复使用的餐具——哪一种会产生更多塑料垃圾？",opts:["堂食使用可重复餐具","塑料外带容器"],correct:1,fact:"新加坡一年产生了86.8万吨塑料垃圾，但只有大约4%被回收。外带容器通常沾有食物残渣，几乎全部会被直接焚烧，最终送往实马高。",mascot:"每一个外带容器最终都会来到我这里。"},
{q:"为打包食物额外拿一个塑料袋，还是直接用手拿容器——哪一种使用更多一次性塑料？",opts:["塑料手提袋","直接用手拿"],correct:0,fact:"塑料袋的设计只为一次回家的路程，用完即成垃圾。不拿袋子是你一天之中最简单的减塑方式之一。",mascot:"多一个袋子，就是多一件最终要由我处理的东西。"},
{q:"小贩中心的蔗渣纤维（甘蔗渣）容器，还是标准的透明塑料（PET）容器——如果两者最终都被随意丢弃在环境中而非妥善处理，哪一种更有可能自然分解？",opts:["透明塑料（PET）容器","蔗渣纤维容器"],correct:1,fact:"蔗渣是甘蔗加工的植物纤维副产品，比可在环境中存留数百年的PET分解得快得多。不过在新加坡的垃圾处理系统中，两者在正常收集流程中都会被焚烧。",mascot:"并非每一种容器离开你手中后的命运都相同。"},
{q:"以下哪一种小贩中心物品，即使被放入回收箱，通常也是最难以回收的？",opts:["带有食物残渣、未清洗的聚苯乙烯泡沫盒","已清洗晾干的PET饮料瓶","铝制饮料罐"],correct:0,fact:"沾有食物的聚苯乙烯泡沫几乎从不被回收商接受，因为清洁成本过高，还会污染同一箱中的其他可回收物。相比之下，干净的PET瓶和铝罐是相对最容易回收的材料。",mascot:"物品越脏，就越有可能落到我这里，而不是被回收。"},
{q:"一个小贩摊位用一个硬塑料饭盒、3个塑料酱料包、一个塑料勺子和一个塑料袋来打包你的餐点。这总共是多少件独立的一次性塑料制品？",opts:["3","4","5","6"],correct:3,fact:"人们很容易低估一份订单中累积了多少件独立的塑料制品。酱料包和袋子常常被忽略，但每一件都是独立的垃圾：饭盒、三个酱料包、勺子和袋子加起来一共是六件。",mascot:"请仔细数一数，我可是仔细数过的。"}
],
[
{q:"在收银台支付少许费用购买塑料袋，还是自带可重复使用的袋子——哪一种浪费更多一次性塑料？",opts:["收银台购买的塑料袋","自带可重复使用袋子"],correct:0,fact:"新加坡的塑料回收率只有大约6%。几乎每一个被使用的塑料袋最终都注定成为堆填区的垃圾。",mascot:"在柜台，一个袋子对你来说也许很便宜，但对环境而言并不便宜。"},
{q:"购买用塑料袋和泡沫托盘预先包装好的苹果，还是自己挑选散装苹果放入购物篮——哪一种塑料包装足迹更高？",opts:["散装苹果","预先包装的苹果"],correct:1,fact:"预先包装的水果在本来不需要任何包装的食物上，额外增加了一个塑料袋和一个泡沫托盘。一个苹果的代价变成了两种垃圾。",mascot:"水果并不需要穿上外衣。"},
{q:"同样大小的玻璃罐装果酱，还是塑料挤压瓶装果酱——假设两者最终都未被回收而被直接丢弃，哪一种在制造阶段通常被认为消耗更多资源？",opts:["塑料挤压瓶","玻璃罐"],correct:1,fact:"玻璃更重，生产和运输所需的能源远多于塑料，尽管塑料污染在丢弃后往往更显眼、存留时间也更长。制造足迹和处理影响是两个不同的问题，这也是为什么这类比较往往并不像表面看起来那么简单。",mascot:"没有什么是完全没有影响的，包括那些常见的塑料替代品。"},
{q:"以下哪一种超市包装材料，即使是干净的，通常也是新加坡回收设施最难处理的？",opts:["透明PET瓶","铝罐","薄保鲜膜（LDPE）"],correct:2,fact:"像保鲜膜这样的薄塑料薄膜很容易卡住分拣机械，大多数回收设施都会拒收，而坚硬的PET瓶或铝罐相对容易分拣和处理。",mascot:"薄塑料薄膜带来的麻烦，远超它体积给人的印象。"},
{q:"新加坡整体塑料垃圾的回收率最接近以下哪个数字？",opts:["6%","25%","15%","1%"],correct:0,fact:"新加坡每年产生的塑料垃圾中，只有大约6%被回收，主要是因为大部分塑料都沾有食物残渣或与其他材料混合，导致分拣和再加工在经济上不划算。",mascot:"大多数人猜的数字都比真实数字要高。"}
],
[
{q:"订购珍珠奶茶时，将「无需餐具」选项打开，还是保持关闭——哪一种会立即产生更多塑料垃圾？",opts:["选项已打开（无需餐具）","选项保持关闭（附带餐具）"],correct:1,fact:"不打开这个选项，系统会自动附上你可能根本不需要的吸管和餐具。在应用里轻轻一点，就能真正减少每一单的塑料垃圾。",mascot:"一个小小的设置，就能为我少处理一根吸管。"},
{q:"网购一件小物品，用气泡信封和气泡膜包装送达，还是到实体店购买同一件商品——哪一种产生更多与运输相关的塑料垃圾？",opts:["带包装的网购订单","到实体店购买"],correct:0,fact:"网购订单往往层层叠加气泡信封、气泡膜和胶带——这些塑料层在简单的实体店购物中完全不会出现。",mascot:"一个手机壳很少需要用到这么多气泡膜。"},
{q:"你同时在同一家网店订购了三件商品。哪种配送方式通常会产生更少的总包装垃圾？",opts:["商家在每件商品准备好后立即分别发货","商家将三件商品合并成一个包裹发货"],correct:1,fact:"合并配送意味着更少的箱子、更少的胶带和更少的气垫，尽管商品一准备好就立即发货有时会让顾客感觉更快。",mascot:"为一个包裹多等一会儿，往往比收到三个分开的包裹更好。"},
{q:"在电商配送中常用的包装材料里，哪一种在新加坡通常最难以回收？",opts:["瓦楞纸箱","塑料气垫或气泡膜","纸质胶带"],correct:1,fact:"塑料气垫和气泡膜是薄薄的混合材料薄膜，大多数回收设施都无法处理，而纸箱在新加坡已有成熟的回收渠道。",mascot:"纸箱有明确的回收去处，这种塑料大多没有。"},
{q:"如果每天叫外卖，每单大约产生4件一次性塑料制品（容器、盖子、袋子、餐具包），一周下来，一个人总共大约会产生多少件独立的塑料制品？",opts:["14","28","7","21"],correct:1,fact:"七天的外卖，每单大约四件一次性用品，一周下来一个人总共大约会累积28件独立的塑料制品。",mascot:"累积的速度比大多数人想象的要快。"}
],
[
{q:"每天喝进口瓶装矿泉水，还是使用可重复使用的水壶喝水——哪一种产生更多PET瓶垃圾？",opts:["瓶装矿泉水","可重复使用水壶"],correct:0,fact:"每人每天一瓶，一年下来超过300个PET瓶。新加坡的自来水可以安全饮用，使用水壶可以完全避免这种垃圾。",mascot:"一年下来就是365个瓶子，而这些水本可以从水龙头免费获得。"},
{q:"用一次性塑料湿巾清洁双手，还是用肥皂和水清洗——哪一种产生更多塑料微纤维垃圾？",opts:["肥皂和水","一次性湿巾"],correct:1,fact:"大多数湿巾是用聚酯等塑料纤维编织而成的，无法生物降解。它们实际上是伪装成纸巾的塑料垃圾。",mascot:"湿巾看起来很柔软，但很多其实是伪装的塑料。"},
{q:"用标注「可生物降解」的塑料袋，还是用普通塑料袋来套家中的垃圾桶——假设两者最终都作为日常垃圾在新加坡被焚烧，哪一种仍然会留下源自塑料的灰烬残留？",opts:["两者大致相同，都会留下","只有普通塑料袋会"],correct:0,fact:"新加坡几乎所有的家庭垃圾在处理前都会先被焚烧，两种塑料袋燃烧后都会留下灰烬残留。「可生物降解」这个标签在堆肥环境中意义更大，而在焚化炉中，两者的差别比大多数人想象的要小得多。",mascot:"光靠一个标签，并不能决定一件东西最终会去哪里。真正决定的是它所经过的处理系统。"},
{q:"以下哪种日常习惯，从一整年来看，通常为一个人产生的塑料垃圾最少？",opts:["买一把耐用的雨伞，用上好几年","每次突然下雨就买一次性雨衣","不管状况如何，每年都买一把新雨伞"],correct:0,fact:"一把耐用的雨伞用上好几年，比每年更换雨伞或反复购买一次性雨衣，长期下来产生的塑料垃圾要少得多。",mascot:"你用得最久的物品，往往是对垃圾填埋场影响最小的那一个。"},
{q:"新加坡的整体固体垃圾体积，在被送往实马高之前，通过焚烧大约能减少多少？",opts:["大约30%","大约50%","大约90%","大约70%"],correct:2,fact:"焚烧能将新加坡垃圾的体积最多减少约90%，不过剩下的灰烬仍需要处理，而这正是最终运往实马高的部分。",mascot:"即使经过焚烧，最后总会剩下一些东西留给我。"}
]
],
ms:[
[
{q:"Membeli makanan bungkus dalam bekas plastik berbanding makan di tempat menggunakan pinggan boleh guna semula — yang manakah menghasilkan lebih banyak sisa plastik?",opts:["Makan di tempat menggunakan pinggan boleh guna semula","Bekas plastik bungkus"],correct:1,fact:"Singapura menghasilkan 868,000 tan sisa plastik dalam setahun, tetapi hanya kira-kira 4 peratus sahaja yang dikitar semula. Bekas bungkus biasanya tercemar dengan makanan, jadi hampir semuanya dihantar terus untuk pembakaran dan kemudian ke Semakau.",mascot:"Setiap bekas bungkus akhirnya akan sampai ke tempat saya."},
{q:"Mengambil beg plastik untuk bungkusan anda berbanding membawa bekas dengan tangan — yang manakah menggunakan lebih banyak plastik sekali guna?",opts:["Beg plastik","Bawa dengan tangan"],correct:0,fact:"Beg plastik direka untuk satu perjalanan pulang sahaja, kemudian menjadi sampah. Tidak mengambil beg adalah salah satu cara paling mudah untuk mengurangkan penggunaan plastik anda pada hari itu.",mascot:"Satu beg tambahan bermakna satu lagi benda yang akhirnya perlu saya uruskan."},
{q:"Bekas gentian tebu (bagasse) dari gerai penjaja berbanding bekas plastik jernih (PET) biasa — sekiranya kedua-duanya berakhir sebagai sampah terbuang di alam sekitar dan bukan dilupuskan dengan betul, yang manakah lebih berkemungkinan terurai secara semula jadi?",opts:["Bekas plastik jernih (PET)","Bekas gentian tebu (bagasse)"],correct:1,fact:"Bagasse ialah hasil sampingan gentian tumbuhan daripada pemprosesan tebu dan terurai jauh lebih cepat berbanding PET yang boleh kekal di alam sekitar selama beratus-ratus tahun. Namun, dalam sistem pelupusan sisa Singapura, kedua-duanya tetap dibakar sebagai sebahagian daripada kutipan biasa.",mascot:"Tidak semua bekas bernasib sama sebaik sahaja ia meninggalkan tangan anda."},
{q:"Antara item pusat penjaja berikut, yang manakah biasanya PALING sukar dikitar semula, walaupun diletakkan dalam tong kitar semula?",opts:["Kotak polistirena berbusa yang belum dibasuh dan bersisa makanan","Botol minuman PET yang telah dibasuh dan dikeringkan","Tin minuman aluminium"],correct:0,fact:"Polistirena yang tercemar makanan hampir tidak pernah diterima oleh pengitar semula kerana sukar dan tidak menjimatkan untuk dibersihkan, malah boleh mencemarkan bahan kitar semula lain dalam tong yang sama. Botol PET dan tin aluminium yang bersih, sebaliknya, antara bahan yang paling mudah dikitar semula.",mascot:"Semakin kotor sesuatu item, semakin besar kemungkinannya ia berakhir dengan saya dan bukan dikitar semula."},
{q:"Sebuah gerai penjaja membungkus pesanan anda dalam kotak bento plastik tegar berserta 3 sachet sos plastik, satu sudu plastik, dan satu beg plastik. Berapakah jumlah keseluruhan item plastik sekali guna yang berasingan itu?",opts:["3","4","5","6"],correct:3,fact:"Mudah untuk kita meremehkan berapa banyak item plastik berasingan yang terkumpul dalam satu pesanan. Sachet dan beg sering terlepas pandang, tetapi setiap satu adalah sisa yang berasingan: kotak bento, tiga sachet, sudu, dan beg — jumlahnya enam.",mascot:"Kira dengan teliti. Saya sendiri sentiasa mengiranya."}
],
[
{q:"Membayar sedikit bayaran untuk beg plastik di kaunter bayaran berbanding membawa beg boleh guna semula sendiri — yang manakah membazirkan lebih banyak plastik sekali guna?",opts:["Beg plastik di kaunter bayaran","Beg boleh guna semula"],correct:0,fact:"Kadar kitar semula plastik Singapura hanya kira-kira 6 peratus sahaja. Hampir setiap beg plastik yang digunakan hampir pasti akan berakhir sebagai bahan tapak pelupusan.",mascot:"Satu beg mungkin murah untuk anda di kaunter, tetapi ia tidak murah untuk alam sekitar."},
{q:"Membeli epal yang telah dibungkus dalam beg plastik berserta dulang busa berbanding memilih epal longgar ke dalam bakul anda sendiri — yang manakah mempunyai kesan pembungkusan plastik yang lebih tinggi?",opts:["Epal longgar","Epal yang telah dibungkus"],correct:1,fact:"Buah yang telah dibungkus menambah beg plastik DAN dulang busa di atas makanan yang sebenarnya tidak memerlukan kedua-duanya. Itu bermakna dua aliran sisa berasingan untuk sebiji epal sahaja.",mascot:"Buah-buahan tidak memerlukan kostum."},
{q:"Balang kaca berisi jem berbanding botol picit plastik bersaiz sama — dengan andaian kedua-duanya tidak dikitar semula dan akhirnya dibuang, yang manakah umumnya dianggap lebih memerlukan banyak sumber untuk dihasilkan pada peringkat pembuatan?",opts:["Botol picit plastik","Balang kaca"],correct:1,fact:"Kaca lebih berat dan memerlukan tenaga yang jauh lebih banyak untuk dihasilkan dan diangkut berbanding plastik, walaupun pencemaran plastik lebih ketara dan bertahan lebih lama selepas dibuang. Kesan pembuatan dan kesan pelupusan adalah dua isu berbeza, dan inilah sebabnya persoalan sebegini jarang semudah yang kelihatan.",mascot:"Tiada apa yang benar-benar bebas daripada kesan, termasuk alternatif biasa kepada plastik."},
{q:"Antara bahan pembungkusan pasar raya berikut, yang manakah umumnya PALING sukar diproses oleh kemudahan kitar semula Singapura, walaupun bersih?",opts:["Botol PET jernih","Tin aluminium","Filem pelekat nipis (LDPE)"],correct:2,fact:"Filem plastik nipis seperti filem pelekat cenderung menyumbat jentera pengasingan dan ditolak oleh kebanyakan kemudahan, berbeza dengan botol PET tegar atau tin aluminium yang agak mudah diasingkan dan diproses.",mascot:"Filem plastik nipis membawa lebih banyak masalah berbanding saiznya yang kecil."},
{q:"Kadar kitar semula keseluruhan Singapura bagi sisa plastik paling hampir dengan angka yang manakah berikut?",opts:["6%","25%","15%","1%"],correct:0,fact:"Singapura hanya mengitar semula kira-kira 6 peratus daripada sisa plastik yang dihasilkannya, sebahagian besarnya kerana kebanyakan plastik tercemar dengan makanan atau bercampur dengan bahan lain, menjadikannya tidak menjimatkan untuk diasingkan dan diproses semula.",mascot:"Kebanyakan orang meneka angka yang lebih tinggi daripada angka sebenar."}

[
{q:"Memesan teh buih dengan togol 'tidak perlukan kutleri' DIHIDUPKAN berbanding DIMATIKAN — yang manakah menghasilkan lebih banyak sisa plastik serta-merta?",opts:["Togol dihidupkan (tiada kutleri)","Togol dimatikan (kutleri disertakan)"],correct:1,fact:"Membiarkan togol itu dimatikan secara automatik menambah straw dan kutleri yang mungkin anda tidak perlukan. Satu ketikan sahaja dalam aplikasi boleh mengurangkan plastik sebenar bagi setiap pesanan.",mascot:"Satu tetapan kecil bermakna satu straw kurang untuk saya uruskan."},
{q:"Memesan item kecil secara dalam talian, dibungkus dengan polymailer dan bungkusan buih, berbanding membeli item yang sama di kedai fizikal — yang manakah menghasilkan lebih banyak sisa plastik berkaitan penghantaran?",opts:["Pesanan dalam talian dengan pembungkusan","Membeli di kedai"],correct:0,fact:"Pesanan dalam talian selalunya menambah polymailer, bungkusan buih, dan pita — lapisan plastik yang langsung tidak wujud dalam pembelian mudah di kedai.",mascot:"Sarung telefon biasanya tidak memerlukan bungkusan buih sebanyak itu."},
{q:"Anda memesan tiga item daripada kedai dalam talian yang sama pada masa yang sama. Kaedah penghantaran yang manakah biasanya menghasilkan jumlah sisa pembungkusan yang lebih sedikit?",opts:["Peniaga menghantar setiap item secara berasingan sebaik sahaja ia sedia","Peniaga menggabungkan ketiga-tiga item ke dalam satu bungkusan"],correct:1,fact:"Penghantaran yang digabungkan bermaksud lebih sedikit kotak, pita, dan kusyen udara secara keseluruhan, walaupun menghantar item sebaik sahaja sedia kadangkala terasa lebih pantas bagi pelanggan.",mascot:"Menunggu sedikit lebih lama untuk satu bungkusan selalunya lebih baik daripada tiga bungkusan berasingan."},
{q:"Antara bahan pembungkusan yang biasa digunakan dalam penghantaran e-dagang, yang manakah umumnya paling sukar dikitar semula di Singapura?",opts:["Kotak kadbod berkedut","Kusyen udara plastik atau bungkusan buih","Pita berasaskan kertas"],correct:1,fact:"Kusyen udara plastik dan bungkusan buih adalah filem nipis pelbagai bahan yang tidak dapat diproses oleh kebanyakan kemudahan, berbeza dengan kadbod yang mempunyai aliran kitar semula yang mantap di Singapura.",mascot:"Kadbod ada laluan yang jelas ke hadapan. Plastik jenis ini kebanyakannya tidak."},
{q:"Seminggu penghantaran makanan harian, dengan kira-kira 4 item plastik sekali guna bagi setiap pesanan (bekas, penutup, beg, set kutleri), menjumlahkan kira-kira berapa banyak item plastik berasingan bagi seorang individu?",opts:["14","28","7","21"],correct:1,fact:"Tujuh hari penghantaran, dengan kira-kira empat item sekali guna bagi setiap pesanan, menjumlahkan kira-kira 28 keping plastik berasingan dalam seminggu bagi seorang individu.",mascot:"Jumlahnya bertambah lebih pantas daripada yang kebanyakan orang jangkakan."}

[
{q:"Minum air mineral botol import setiap hari berbanding minum daripada botol boleh guna semula — yang manakah menghasilkan lebih banyak sisa botol PET?",opts:["Air mineral botol","Botol boleh guna semula"],correct:0,fact:"Satu botol sehari bermaksud lebih daripada 300 botol PET setahun, bagi setiap individu. Air paip Singapura selamat diminum, jadi botol boleh guna semula mengelakkan sisa ini sepenuhnya.",mascot:"Jumlahnya menjadi 365 botol setahun untuk air yang sebenarnya percuma daripada paip."},
{q:"Menggunakan tisu basah plastik sekali guna untuk membersihkan tangan berbanding membasuh dengan sabun dan air — yang manakah menghasilkan lebih banyak sisa mikrofiber plastik?",opts:["Sabun dan air","Tisu basah sekali guna"],correct:1,fact:"Kebanyakan tisu basah ditenun daripada gentian plastik seperti poliester, jadi ia tidak terbiodegradasi. Ia sebenarnya adalah sisa plastik yang menyamar sebagai tisu.",mascot:"Tisu basah kelihatan lembut, tetapi kebanyakannya adalah plastik yang tersembunyi."},
{q:"Beg plastik berlabel 'boleh terbiodegradasi' berbanding beg plastik biasa, kedua-duanya digunakan untuk melapik tong sampah rumah anda — dengan andaian kedua-duanya akhirnya dibakar di Singapura sebagai sampah rumah biasa, yang manakah masih meninggalkan baki abu berasaskan plastik?",opts:["Kedua-duanya, secara relatifnya sama","Hanya beg plastik biasa sahaja"],correct:0,fact:"Hampir semua sisa isi rumah di Singapura dibakar sebelum dilupuskan, dan kedua-dua jenis beg meninggalkan baki abu selepas itu. Label 'boleh terbiodegradasi' lebih bermakna dalam persekitaran pengkomposan berbanding relau pembakaran, jadi dalam sistem Singapura, perbezaan antara kedua-duanya lebih kecil daripada yang disangka kebanyakan orang.",mascot:"Label sahaja tidak menentukan ke mana sesuatu akhirnya pergi. Sistem yang dilaluinyalah yang menentukan."},
{q:"Tabiat harian yang manakah umumnya menghasilkan sisa plastik PALING sedikit sepanjang setahun bagi seorang individu?",opts:["Membeli satu payung tahan lasak dan menggunakannya selama bertahun-tahun","Membeli jubah hujan sekali guna setiap kali hujan turun secara tiba-tiba","Membeli payung baharu setiap tahun tanpa mengira keadaannya"],correct:0,fact:"Satu payung tahan lasak yang digunakan selama bertahun-tahun menghasilkan jauh lebih sedikit sisa plastik berbanding menggantikannya setiap tahun atau membeli jubah hujan sekali guna berulang kali.",mascot:"Item yang anda simpan paling lama biasanya adalah item yang paling kurang penting kepada tapak pelupusan."},
{q:"Kira-kira berapa peratus jumlah isipadu sisa pepejal Singapura yang dikurangkan melalui pembakaran sebelum bakinya dihantar ke Semakau?",opts:["Kira-kira 30%","Kira-kira 50%","Kira-kira 90%","Kira-kira 70%"],correct:2,fact:"Pembakaran mengurangkan isipadu sisa Singapura sehingga kira-kira 90 peratus, walaupun abu yang tinggal masih perlu dilupuskan, dan itulah yang akhirnya dihantar ke Semakau.",mascot:"Walaupun selepas dibakar, sentiasa ada sesuatu yang tertinggal untuk saya."}

ta:[
[
{q:"பிளாஸ்டிக் கொள்கலனில் வாங்கிச் செல்லும் உணவு vs மீள்பயன்படுத்தக்கூடிய தட்டுகளில் உள்ளேயே அமர்ந்து சாப்பிடுவது — எது அதிக பிளாஸ்டிக் கழிவை உருவாக்குகிறது?",opts:["உள்ளேயே அமர்ந்து மீள்பயன் தட்டுகளில் சாப்பிடுதல்","பிளாஸ்டிக் டேக்அவே கொள்கலன்"],correct:1,fact:"சிங்கப்பூர் ஒரு ஆண்டில் 868,000 டன் பிளாஸ்டிக் கழிவை உருவாக்கியது, ஆனால் அதில் சுமார் 4% மட்டுமே மீள்சுழற்சி செய்யப்படுகிறது. டேக்அவே கொள்கலன்கள் பொதுவாக உணவு கறையுடன் இருப்பதால், அவை கிட்டத்தட்ட அனைத்தும் நேரடியாக எரிக்கப்பட்டு பின்னர் சேமக்கௌவுக்கு அனுப்பப்படுகின்றன.",mascot:"ஒவ்வொரு டேக்அவே கொள்கலனும் இறுதியில் என்னிடம் வந்து சேரும்."},
{q:"உங்கள் பாக்கெட்டிற்காக ஒரு பிளாஸ்டிக் பையை எடுப்பது vs கொள்கலனை கையால் சுமப்பது — எது அதிக ஒரு முறை பயன் பிளாஸ்டிக்கைப் பயன்படுத்துகிறது?",opts:["பிளாஸ்டிக் பை","கையால் சுமத்தல்"],correct:0,fact:"பிளாஸ்டிக் பைகள் ஒரு வீட்டுப் பயணத்திற்காக மட்டுமே வடிவமைக்கப்பட்டுள்ளன, பின்னர் கழிவாகிவிடும். பையை எடுக்காமல் இருப்பது, ஒரு நாளில் உங்கள் பிளாஸ்டிக் பயன்பாட்டைக் குறைக்கும் எளிய வழிகளில் ஒன்று.",mascot:"ஒரு கூடுதல் பை என்பது இறுதியில் நான் கையாள வேண்டிய ஒரு கூடுதல் பொருள்."},
{q:"ஹாக்கர் கடையின் கரும்பு நார் (bagasse) கொள்கலன் vs வழக்கமான தெளிவான பிளாஸ்டிக் (PET) கொள்கலன் — இரண்டும் முறையாக அகற்றப்படாமல் சுற்றுச்சூழலில் கழிவாக விடப்பட்டால், எது இயற்கையாக மக்கிப் போக அதிக வாய்ப்புள்ளது?",opts:["தெளிவான பிளாஸ்டிக் (PET) கொள்கலன்","கரும்பு நார் கொள்கலன்"],correct:1,fact:"Bagasse என்பது கரும்பு பதப்படுத்தலில் இருந்து கிடைக்கும் தாவர நார் துணைப் பொருள் ஆகும், மேலும் இது நூற்றுக்கணக்கான ஆண்டுகள் சுற்றுச்சூழலில் நிலைத்திருக்கக்கூடிய PET ஐ விட மிக விரைவாக மக்கிப் போகும். ஆனால் சிங்கப்பூரின் கழிவு அமைப்பில், இரண்டும் வழக்கமான சேகரிப்பின் ஒரு பகுதியாக எரிக்கப்படுகின்றன.",mascot:"ஒவ்வொரு கொள்கலனும் உங்கள் கைகளை விட்டு வெளியேறிய பிறகு ஒரே மாதிரி நடந்துகொள்வதில்லை."},
{q:"பின்வரும் ஹாக்கர் சென்டர் பொருட்களில், மீள்சுழற்சி தொட்டியில் போடப்பட்டாலும் பொதுவாக மீள்சுழற்சி செய்ய மிகவும் கடினமானது எது?",opts:["உணவு கறையுடன் கழுவப்படாத பாலிஸ்டைரீன் நுரை பெட்டி","கழுவி உலர்த்தப்பட்ட PET குடிநீர் பாட்டில்","அலுமினியக் குடிநீர் டின்"],correct:0,fact:"உணவால் அசுத்தமான பாலிஸ்டைரீனை மீள்சுழற்சி நிறுவனங்கள் கிட்டத்தட்ட ஒருபோதும் ஏற்றுக்கொள்வதில்லை, ஏனெனில் அதை சுத்தம் செய்வது பொருளாதார ரீதியாக சாத்தியமில்லை, மேலும் அது அதே தொட்டியிலுள்ள மற்ற மீள்சுழற்சி பொருட்களை அசுத்தப்படுத்தும். சுத்தமான PET பாட்டில்களும் அலுமினிய டின்களும் ஒப்பீட்டளவில் மிக எளிதாக மீள்சுழற்சி செய்யப்படும் பொருட்களாகும்.",mascot:"ஒரு பொருள் எவ்வளவு அழுக்காக இருக்கிறதோ, அது மீள்சுழற்சி செய்யப்படுவதற்குப் பதிலாக என்னிடம் வந்து சேரும் வாய்ப்பு அவ்வளவு அதிகம்."},
{q:"ஒரு ஹாக்கர் கடை உங்கள் ஆர்டரை ஒரு கடினமான பிளாஸ்டிக் பெண்டோ பெட்டியிலும், 3 பிளாஸ்டிக் சாஸ் பாக்கெட்டுகளிலும், ஒரு பிளாஸ்டிக் ஸ்பூனிலும், ஒரு பிளாஸ்டிக் பையிலும் பேக் செய்கிறது. மொத்தம் எத்தனை தனித்தனி ஒரு முறை பயன் பிளாஸ்டிக் பொருட்கள் அவை?",opts:["3","4","5","6"],correct:3,fact:"ஒரு ஆர்டரில் எத்தனை தனித்தனி பிளாஸ்டிக் பொருட்கள் குவிகின்றன என்பதை குறைத்து மதிப்பிடுவது எளிது. சாஸ் பாக்கெட்டுகளும் பைகளும் பெரும்பாலும் கவனிக்கப்படுவதில்லை, ஆனால் ஒவ்வொன்றும் தனி கழிவு: பெண்டோ பெட்டி, மூன்று பாக்கெட்டுகள், ஸ்பூன், பை என அனைத்தும் சேர்த்து ஆறு.",mascot:"கவனமாக எண்ணுங்கள். நான் நிச்சயமாக எண்ணுவேன்."}
],
[
{q:"பணம் செலுத்தும் இடத்தில் ஒரு சிறிய கட்டணத்திற்கு பிளாஸ்டிக் பை வாங்குவது vs உங்கள் சொந்த மீள்பயன் பையைக் கொண்டு வருவது — எது அதிக ஒரு முறை பயன் பிளாஸ்டிக்கை வீணாக்குகிறது?",opts:["பணம் செலுத்தும் இடத்தில் வாங்கும் பிளாஸ்டிக் பை","மீள்பயன் பை"],correct:0,fact:"சிங்கப்பூரின் பிளாஸ்டிக் மீள்சுழற்சி விகிதம் வெறும் 6% மட்டுமே. பயன்படுத்தப்படும் கிட்டத்தட்ட ஒவ்வொரு பிளாஸ்டிக் பையும் நிலத்தடி கழிவாக மாறுவது உறுதி.",mascot:"கவுன்டரில் ஒரு பை உங்களுக்கு மலிவாக இருக்கலாம், ஆனால் அது சுற்றுச்சூழலுக்கு மலிவானது அல்ல."},
{q:"பிளாஸ்டிக் பையிலும் ஃபோம் தட்டிலும் முன்கூட்டியே பேக் செய்யப்பட்ட ஆப்பிள்களை வாங்குவது vs உங்கள் சொந்த கூடைக்குள் தளர்வான ஆப்பிள்களை எடுப்பது — எது அதிக பிளாஸ்டிக் பேக்கேஜிங் தாக்கத்தை கொண்டுள்ளது?",opts:["தளர்வான ஆப்பிள்கள்","முன்கூட்டியே பேக் செய்யப்பட்ட ஆப்பிள்கள்"],correct:1,fact:"முன்கூட்டியே பேக் செய்யப்பட்ட பழங்கள், தேவைப்படாத ஒரு பிளாஸ்டிக் பையையும் ஃபோம் தட்டையும் சேர்க்கின்றன. அதாவது ஒரு ஆப்பிளுக்கு இரண்டு தனித்தனி கழிவு வகைகள்.",mascot:"பழங்களுக்கு உடை அணிவிக்க வேண்டிய அவசியமில்லை."},
{q:"ஒரே அளவிலான ஜாம் நிரப்பப்பட்ட கண்ணாடி ஜாடி vs பிளாஸ்டிக் ஸ்க்வீஸ் பாட்டில் — இரண்டும் மீள்சுழற்சி செய்யப்படாமல் இறுதியில் வீசப்படும் என்று வைத்துக்கொண்டால், எது தயாரிப்பு கட்டத்தில் அதிக வளங்களைப் பயன்படுத்துவதாகக் கருதப்படுகிறது?",opts:["பிளாஸ்டிக் ஸ்க்வீஸ் பாட்டில்","கண்ணாடி ஜாடி"],correct:1,fact:"பிளாஸ்டிக் மாசு வீசப்பட்ட பிறகு அதிகம் தெரியக்கூடியதாகவும் நீண்ட காலம் நீடிப்பதாகவும் இருந்தாலும், கண்ணாடி கனமானது, அதை உற்பத்தி செய்யவும் கொண்டு செல்லவும் பிளாஸ்டிக்கை விட மிக அதிக ஆற்றல் தேவைப்படுகிறது. உற்பத்தி தாக்கமும் அகற்றல் தாக்கமும் இரண்டு வெவ்வேறு விஷயங்கள், அதனால்தான் இது போன்ற ஒப்பீடுகள் தோன்றுவதைவிட எளிமையானதாக இருப்பதில்லை.",mascot:"எதுவும் முழுமையாக தாக்கமில்லாமல் இல்லை, பிளாஸ்டிக்கிற்கு பொதுவான மாற்றுகள் உட்பட."},
{q:"பின்வரும் சூப்பர்மார்க்கெட் பேக்கேஜிங் பொருட்களில், சுத்தமாக இருந்தாலும், சிங்கப்பூரின் மீள்சுழற்சி வசதிகளால் செயலாக்குவதற்கு பொதுவாக மிகவும் கடினமானது எது?",opts:["தெளிவான PET பாட்டில்","அலுமினியம் டின்","மெல்லிய க்ளிங் ஃபிலிம் (LDPE)"],correct:2,fact:"க்ளிங் ஃபிலிம் போன்ற மெல்லிய பிளாஸ்டிக் படலம் வரிசைப்படுத்தும் இயந்திரங்களை அடைக்கும் போக்கு உள்ளது, மேலும் பெரும்பாலான வசதிகளால் நிராகரிக்கப்படுகிறது, ஆனால் கடினமான PET பாட்டில்கள் அல்லது அலுமினியம் டின்கள் ஒப்பீட்டளவில் எளிதாக வரிசைப்படுத்தப்பட்டு செயலாக்கப்படும்.",mascot:"மெல்லிய பிளாஸ்டிக் படலம் அதன் அளவை விட அதிக பிரச்சனையை உருவாக்குகிறது."},
{q:"சிங்கப்பூரின் ஒட்டுமொத்த பிளாஸ்டிக் கழிவு மீள்சுழற்சி விகிதம் பின்வரும் எந்த எண்ணிக்கைக்கு மிக அருகில் உள்ளது?",opts:["6%","25%","15%","1%"],correct:0,fact:"சிங்கப்பூர் உற்பத்தி செய்யும் பிளாஸ்டிக் கழிவில் சுமார் 6% மட்டுமே மீள்சுழற்சி செய்கிறது, ஏனெனில் பெரும்பாலான பிளாஸ்டிக் உணவால் அசுத்தமாகி அல்லது மற்ற பொருட்களுடன் கலந்திருக்கிறது, இது வரிசைப்படுத்துவதையும் மறுசுழற்சி செய்வதையும் பொருளாதார ரீதியாக சாத்தியமற்றதாக்குகிறது.",mascot:"பெரும்பாலான மக்கள் உண்மையான எண்ணிக்கையை விட அதிகமாக யூகிக்கிறார்கள்."}
],
[
{q:"பப்பிள் டீ ஆர்டர் செய்யும்போது 'கட்லரி தேவையில்லை' டாகுளை இயக்கி வைப்பது vs அணைத்து வைப்பது — எது உடனடியாக அதிக பிளாஸ்டிக் கழிவை உருவாக்குகிறது?",opts:["டாகுள் இயக்கப்பட்டது (கட்லரி தேவையில்லை)","டாகுள் அணைக்கப்பட்டது (கட்லரி சேர்க்கப்பட்டுள்ளது)"],correct:1,fact:"அந்த டாகுளை அணைத்து வைப்பது, உங்களுக்கு தேவைப்படாத ஸ்ட்ராவையும் கட்லரியையும் தானாகவே சேர்க்கும். ஆப்பில் ஒரே ஒரு தட்டு, ஒவ்வொரு ஆர்டரிலும் உண்மையான பிளாஸ்டிக்கைக் குறைக்கலாம்.",mascot:"ஒரு சிறிய அமைப்பு, எனக்கு கையாள வேண்டிய ஒரு ஸ்ட்ரா குறைவு என்று அர்த்தம்."},
{q:"பாலிமெய்லர் மற்றும் பப்பிள் ராப்புடன் ஒரு சிறிய பொருளை ஆன்லைனில் ஆர்டர் செய்வது vs அதே பொருளை ஒரு உடல்நிலை கடையில் இருந்து வாங்குவது — எது அதிக ஷிப்பிங் தொடர்பான பிளாஸ்டிக் கழிவை உருவாக்குகிறது?",opts:["பேக்கேஜிங்குடன் ஆன்லைன் ஆர்டர்","கடையில் இருந்து வாங்குதல்"],correct:0,fact:"ஆன்லைன் ஆர்டர்கள் பெரும்பாலும் பாலிமெய்லர், பப்பிள் ராப், டேப் ஆகியவற்றை அடுக்கி வைக்கின்றன — இந்த பிளாஸ்டிக் அடுக்குகள் எளிமையான கடை வாங்குதலில் முற்றிலும் இருக்காது.",mascot:"ஒரு ஃபோன் கேசுக்கு பொதுவாக இவ்வளவு பப்பிள் ராப் தேவைப்படாது."},
{q:"நீங்கள் ஒரே ஆன்லைன் கடையில் இருந்து ஒரே நேரத்தில் மூன்று பொருட்களை ஆர்டர் செய்கிறீர்கள். எந்த டெலிவரி முறை பொதுவாக குறைவான மொத்த பேக்கேஜிங் கழிவை உருவாக்குகிறது?",opts:["விற்பனையாளர் ஒவ்வொரு பொருளும் தயாரானவுடன் தனித்தனியாக அனுப்புகிறார்","விற்பனையாளர் மூன்று பொருட்களையும் ஒன்றிணைத்து ஒரே பார்சலில் அனுப்புகிறார்"],correct:1,fact:"ஒன்றிணைக்கப்பட்ட டெலிவரி என்றால் ஒட்டுமொத்தமாக குறைவான பெட்டிகள், டேப், ஏர் குஷன்கள் — தயாரானவுடன் அனுப்புவது சில நேரங்களில் வாடிக்கையாளருக்கு வேகமாக உணரப்பட்டாலும்.",mascot:"ஒரு பார்சலுக்காக இன்னும் கொஞ்சம் காத்திருப்பது, மூன்று தனித்தனியாக வருவதை விட பெரும்பாலும் சிறந்தது."},
{q:"மின்வணிக ஷிப்பிங்கில் பொதுவாக பயன்படுத்தப்படும் பேக்கேஜிங் பொருட்களில், சிங்கப்பூரில் மீள்சுழற்சி செய்ய மிகவும் கடினமானது எது?",opts:["அலை-அலையான அட்டைப் பெட்டி","பிளாஸ்டிக் ஏர் குஷன்கள் அல்லது பப்பிள் ராப்","காகித அடிப்படையிலான டேப்"],correct:1,fact:"பிளாஸ்டிக் ஏர் குஷன்களும் பப்பிள் ராப்பும் மெல்லிய, கலவை பொருள் படலங்கள், அவற்றை பெரும்பாலான வசதிகளால் செயலாக்க முடியாது, ஆனால் அட்டைப் பெட்டிக்கு சிங்கப்பூரில் நிலையான மீள்சுழற்சி வழி உள்ளது.",mascot:"அட்டைப் பெட்டிக்கு தெளிவான வழி உள்ளது. இந்த வகை பிளாஸ்டிக்கிற்கு பெரும்பாலும் இல்லை."},
{q:"ஒரு வாரத்திற்கு தினசரி உணவு டெலிவரி, ஒரு ஆர்டருக்கு சுமார் 4 ஒரு முறை பயன் பிளாஸ்டிக் பொருட்கள் (கொள்கலன், மூடி, பை, கட்லரி தொகுப்பு) — ஒரு நபருக்கு மொத்தம் சுமார் எத்தனை தனித்தனி பிளாஸ்டிக் பொருட்களாக மாறும்?",opts:["14","28","7","21"],correct:1,fact:"ஏழு நாட்கள் டெலிவரி, ஒரு ஆர்டருக்கு சுமார் நான்கு ஒரு முறை பயன் பொருட்களுடன், ஒரு நபருக்கு ஒரு வாரத்தில் சுமார் 28 தனித்தனி பிளாஸ்டிக் பொருட்களாக சேரும்.",mascot:"பெரும்பாலான மக்கள் எதிர்பார்ப்பதை விட வேகமாக இது சேர்ந்துவிடும்."}
],
[
{q:"ஒவ்வொரு நாளும் இறக்குமதி செய்யப்பட்ட பாட்டில் மினரல் வாட்டர் குடிப்பது vs மீள்பயன் ஃபிளாஸ்கில் இருந்து குடிப்பது — எது அதிக PET பாட்டில் கழிவை உருவாக்குகிறது?",opts:["பாட்டில் மினரல் வாட்டர்","மீள்பயன் ஃபிளாஸ்க்"],correct:0,fact:"ஒரு நாளுக்கு ஒரு பாட்டில் என்றால், ஒரு நபருக்கு ஆண்டுக்கு 300க்கும் மேற்பட்ட PET பாட்டில்கள். சிங்கப்பூரின் குழாய் நீர் குடிக்க பாதுகாப்பானது, எனவே ஒரு ஃபிளாஸ்க் இந்த கழிவை முழுவதுமாக தவிர்க்கிறது.",mascot:"குழாயிலிருந்து இலவசமாக கிடைக்கும் தண்ணீருக்கு ஆண்டுக்கு 365 பாட்டில்கள் என்று சேர்கிறது."},

SOUND ENGINE
============================================================ */
let soundOn=true, audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function beep(freq,dur,type,vol){if(!soundOn)return;try{const ctx=getCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type||'sine';osc.frequency.value=freq;gain.gain.value=vol||.15;osc.connect(gain);gain.connect(ctx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);osc.stop(ctx.currentTime+dur);}catch(e){}}
function playCorrect(){beep(523,.12,'sine');setTimeout(()=>beep(784,.18,'sine'),110);}
function playWrong(){beep(180,.3,'sawtooth',.12);}
function playClick(){beep(660,.06,'square',.08);}
function playTrick(){beep(440,.1,'triangle');setTimeout(()=>beep(330,.1,'triangle'),100);setTimeout(()=>beep(440,.15,'triangle'),200);}
function playDamage(){beep(150,.25,'sawtooth',.18);setTimeout(()=>beep(100,.3,'sawtooth',.15),150);}
function playSiren(){if(!soundOn)return;let f=600,rising=true;const iv=setInterval(()=>{beep(f,.15,'sawtooth',.1);f=rising?f+80:f-80;if(f>1000)rising=false;if(f<500)rising=true;},150);setTimeout(()=>clearInterval(iv),3000);}
function playCountBeep(){beep(880,.15,'square',.15);}
function playVictory(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sine'),i*120));}
function playLoss(){[400,300,200,100].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sawtooth',.15),i*150));}

for(let i=0;i<70;i++){

/* ============================================================
BOARD — real <button> elements for accessibility
============================================================ */
function renderBoard(){
const c=cats();
let html=c.map(cat=>`<div class="cat-header" role="columnheader"><span class="cat-icon" aria-hidden="true">${cat.icon}</span><span class="cat-name">${cat.name}</span></div>`).join('');
for(let r=0;r<5;r++){
for(let col=0;col<4;col++){
if(used[col][r]){
html+=`<button class="cell used" disabled aria-label="Already answered" aria-disabled="true">✓</button>`;
} else {
html+=`<button class="cell" data-cat="${col}" data-row="${r}" aria-label="${c[col].name}, ${POINTS[r]} ${t('points')}">${POINTS[r]}</button>`;
}
}
}
const board=document.getElementById('board');
board.innerHTML=html;
board.querySelectorAll('.cell:not(.used)').forEach(btn=>{
btn.addEventListener('click',()=>openQuestion(+btn.dataset.cat,+btn.dataset.row));
});
}

document.getElementById('damageBar').setAttribute('aria-valuenow',totalStrikes);
let stage=0,statusKey='damageHealthy';
if(totalStrikes>=STRIKE_LIMIT){stage=3;statusKey='damageCritical';}
else if(totalStrikes>=STRIKE_LIMIT*.6){stage=2;statusKey='damageCritical';}
else if(totalStrikes>=STRIKE_LIMIT*.3){stage=1;statusKey='damageDamaged';}
document.getElementById('islandStage').innerHTML=getIslandSVG(stage);
const word=totalStrikes===1?'strike':t('strikes');
document.getElementById('damageText').textContent=`${totalStrikes} ${word} / ${STRIKE_LIMIT} — ${t(statusKey)}`;
}
function spawnTrash(){
const stage=document.getElementById('islandStage');
const emojis=['🗑️','🥤','🛍️','🧴','📦'];
const p=document.createElement('div');
p.className='trash-particle';
p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
p.style.left=(30+Math.random()*220)+'px';p.style.top='0px';
p.style.animation='trashFall 1.2s ease forwards';
stage.appendChild(p);setTimeout(()=>p.remove(),1300);
}
function shakeIsland(){const el=document.getElementById('islandStage');el.classList.remove('island-shake');void el.offsetWidth;el.classList.add('island-shake');}
function reactMascot(happy){const f=document.getElementById('mascotFace');f.classList.remove('react-happy','react-sad');void f.offsetWidth;f.classList.add(happy?'react-happy':'react-sad');}
function registerStrike(){
totalStrikes++;playDamage();shakeIsland();spawnTrash();spawnTrash();renderDamage();
if(gameMode==='solo')updateSoloDisplay();
if(totalStrikes>=STRIKE_LIMIT&&!islandLost&&!bonusRoundActive){islandLost=true;setTimeout(beginBonusTransition,900);}
}
/* ============================================================
QUESTION FLOW
============================================================ */
function openQuestion(cat,row){
if(used[cat][row])return;
playClick();currentCell={cat,row};selectedTeamForAward=currentTeam;
renderModal(qs(cat,row),POINTS[row],cat,false,null);
}
function renderModal(q,pts,cat,revealed,chosenIdx){
clearInterval(questionTimerInterval);
document.getElementById('overlay').style.display='flex';
const c=cats();
const optBtns=q.opts.map((o,i)=>{
let cls='opt-btn';
if(revealed){if(i===q.correct)cls+=' correct';else if(i===chosenIdx)cls+=' wrong';}
return `<button class="${cls}" ${revealed?'disabled':''} data-idx="${i}" aria-label="Option ${i+1}: ${o}">${o}</button>`;
}).join('');
const optsClass=q.opts.length===3?'options opts-triple':'options';
const timerHtml=(!revealed&&gameMode==='team')?`<div class="timer-row"><div class="timer-track"><div class="timer-fill" id="timerFill" style="width:100%"></div></div><div class="timer-label" id="timerLabel">${QUESTION_SECS}s</div></div>`:'';
let resultHtml='',mascotHtml='';
if(revealed){
const isTrick=!!q.isTrick,isCorrect=!isTrick&&chosenIdx===q.correct;
const cls=isTrick?'trick':(isCorrect?'correct':'wrong');
const label=isTrick?t('trickQuestion'):(isCorrect?t('correct'):t('notQuite'));
resultHtml=`<div class="result-box ${cls}"><span class="fact-tag">${t('realFact')}</span><br><strong>${label}</strong> ${q.fact}</div>`;
mascotHtml=`<div class="mascot-react"><div class="mface" aria-hidden="true">🗑️</div><div class="mtext">"${q.mascot}"</div></div>`;
}
const teamBtns=TEAMS.map((team,i)=>`<button class="team-btn ${selectedTeamForAward===i?'selected':''}" data-team="${i}" id="atb-${i}">${team}</button>`).join('');
const footerHtml=revealed
?(gameMode==='team'
?`<div style="font-size:13px;color:#9fd8c4;margin-bottom:8px">${t('awardTo')}</div><div class="modal-footer"><div class="team-select">${teamBtns}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="close-btn" id="skipBtn">${t('skip')}</button><button class="award-btn" id="awardBtn">${t('award')} ${pts} ${t('pts')}</button></div></div>`
:`<div class="modal-footer" style="justify-content:center"><button class="award-btn" id="nextBtn">Next ➡</button></div>`)
:`<div class="modal-footer"><button class="close-btn" id="cancelBtn">${t('cancel')}</button></div>`;
document.getElementById('modal').innerHTML=`
<div class="modal-tag">${c[cat].icon} ${c[cat].name}</div>
<div class="modal-pts">${pts} ${t('points')}</div>
${timerHtml}
<div class="modal-question" id="modalQuestion">${q.q}</div>
<div class="${optsClass}">${optBtns}</div>
${mascotHtml}${resultHtml}${footerHtml}`;
// wire buttons with addEventListener — no inline onclick
document.querySelectorAll('.opt-btn:not([disabled])').forEach(btn=>{
btn.addEventListener('click',()=>answer(+btn.dataset.idx));
});
document.querySelectorAll('.team-btn').forEach(btn=>{
btn.addEventListener('click',()=>selectAwardTeam(+btn.dataset.team));
});
const cancelBtn=document.getElementById('cancelBtn');
if(cancelBtn)cancelBtn.addEventListener('click',cancelQuestion);
const skipBtn=document.getElementById('skipBtn');
if(skipBtn)skipBtn.addEventListener('click',()=>closeModal(false));
const awardBtn=document.getElementById('awardBtn');
if(awardBtn)awardBtn.addEventListener('click',awardPoints);
const nextBtn=document.getElementById('nextBtn');
if(nextBtn)nextBtn.addEventListener('click',()=>closeModal(true));
// visible countdown — team mode only, pre-answer
if(!revealed&&gameMode==='team'){
let remaining=QUESTION_SECS;
questionTimerInterval=setInterval(()=>{
remaining--;
const fill=document.getElementById('timerFill'),label=document.getElementById('timerLabel');
if(!fill){clearInterval(questionTimerInterval);return;}
fill.style.width=(remaining/QUESTION_SECS*100)+'%';
label.textContent=remaining+'s';
if(remaining<=10){fill.classList.add('warn');label.classList.add('warn');}
if(remaining<=5){fill.classList.replace('warn','danger');label.classList.replace('warn','danger');}
if(remaining<=0){
clearInterval(questionTimerInterval);
logAnswer(currentCell.cat,currentCell.row,qs(currentCell.cat,currentCell.row),null,false,TEAMS[currentTeam],'timeout');
used[currentCell.cat][currentCell.row]=true;
teamStats[currentTeam].skipped++;
registerStrike();
currentTeam=(currentTeam+1)%3;
document.getElementById('overlay').style.display='none';
renderScoreboard();renderBoard();renderDamage();checkAllUsed();
}
},1000);
}
}
function cancelQuestion(){clearInterval(questionTimerInterval);document.getElementById('overlay').style.display='none';currentCell=null;}
function logAnswer(cat,row,q,chosenIdx,isCorrect,who,reason){
const c=cats();
answerLog.push({
sessionId,mode:gameMode,language:currentLang,who:who||null,
categoryIndex:cat,category:c[cat].name,categoryEn:(CATEGORIES.en[cat]||{}).name||'',
points:POINTS[row],question:q.q,options:q.opts,
correctIndex:q.correct,correctText:q.opts[q.correct],
chosenIndex:chosenIdx===null||chosenIdx===undefined?null:chosenIdx,
chosenText:(chosenIdx===null||chosenIdx===undefined)?null:q.opts[chosenIdx],
isCorrect:!!isCorrect,reason:reason||'answered',
timestamp:new Date().toISOString()
});
}
function answer(idx){
clearInterval(questionTimerInterval);
const {cat,row}=currentCell;
const q=qs(cat,row);
const isTrick=!!q.isTrick, wasCorrect=!isTrick&&idx===q.correct;
const who=gameMode==='solo'?'You':TEAMS[currentTeam];
logAnswer(cat,row,q,idx,wasCorrect,who,'answered');
if(gameMode==='solo'){
if(wasCorrect){playCorrect();reactMascot(true);soloScore+=POINTS[row];soloCorrect++;updateSoloDisplay();}
else{isTrick?playTrick():playWrong();reactMascot(false);soloWrong++;registerStrike();
if(!costliestWrong||POINTS[row]>costliestWrong.points)costliestWrong={team:'You',points:POINTS[row],category:(CATEGORIES.en[cat]||{}).name||''};}
} else {
if(isTrick){playTrick();reactMascot(false);teamStats[currentTeam].wrong++;registerStrike();}
else if(wasCorrect){playCorrect();reactMascot(true);teamStats[currentTeam].correct++;}
else{playWrong();reactMascot(false);teamStats[currentTeam].wrong++;registerStrike();
if(!costliestWrong||POINTS[row]>costliestWrong.points)costliestWrong={team:TEAMS[currentTeam],points:POINTS[row],category:(CATEGORIES.en[cat]||{}).name||''};}
}
renderModal(q,POINTS[row],cat,true,idx);
}
function selectAwardTeam(i){
selectedTeamForAward=i;
document.querySelectorAll('.team-btn').forEach((btn,idx)=>{btn.className='team-btn'+(+btn.dataset.team===i?' selected':'');});
}
function awardPoints(){
const {cat,row}=currentCell;
scores[selectedTeamForAward]+=POINTS[row];
teamStats[selectedTeamForAward].pointsWon+=POINTS[row];
playClick();popScore(selectedTeamForAward);closeModal(true);
}
function closeModal(wasAwarded){
clearInterval(questionTimerInterval);
if(currentCell){
used[currentCell.cat][currentCell.row]=true;
if(gameMode==='team'&&!wasAwarded)teamStats[currentTeam].skipped++;
}
currentTeam=(currentTeam+1)%3;
document.getElementById('overlay').style.display='none';
renderScoreboard();renderBoard();renderDamage();checkAllUsed();
}
function checkAllUsed(){if(used.every(col=>col.every(v=>v))&&!bonusRoundActive&&!islandLost)endGame(false);}
/* ============================================================
BONUS TRANSITION — 3 stages
============================================================ */
function beginBonusTransition(){
clearInterval(questionTimerInterval);
document.getElementById('overlay').style.display='none';
const freeze=document.getElementById('freezeOverlay');
document.getElementById('freezeText').textContent=t('freezeText');
freeze.style.display='flex';playDamage();
setTimeout(()=>{freeze.style.display='none';startAlarmSequence();},1400);
}
function startAlarmSequence(){
const alarm=document.getElementById('alarmOverlay'),content=document.getElementById('alarmContent');
alarm.style.display='flex';playSiren();
content.innerHTML=`<div class="alarm-title">🚨 ${t('alarmTitle')} 🚨</div>`;
let count=3;
function tick(){
content.innerHTML=`<div class="alarm-title">🚨 ${t('alarmTitle')} 🚨</div><div class="alarm-count">${count}</div>`;
playCountBeep();count--;
if(count>=0)setTimeout(tick,1000);
else setTimeout(()=>{alarm.style.display='none';startBonusRound();},700);
}
setTimeout(tick,600);
}
/* ============================================================
BONUS ROUND
============================================================ */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startBonusRound(){
bonusRoundActive=true;
bonusPool=shuffle(Array.from({length:4},(_,c)=>Array.from({length:5},(_,r)=>({cat:c,row:r}))).flat()).slice(0,BONUS_Q_COUNT);
bonusIndex=0;
document.getElementById('bonusOverlay').style.display='flex';
renderBonusQuestion();
}
function renderBonusQuestion(){
if(bonusIndex>=bonusPool.length){bonusSuccess();return;}
const {cat,row}=bonusPool[bonusIndex];
const q=qs(cat,row),c=cats();
bonusTimeLeft=BONUS_SECS;
const dots=bonusPool.map((_,i)=>`<div class="bonus-dot${i<bonusIndex?' done':i===bonusIndex?' current':''}"></div>`).join('');
const optBtns=q.opts.map((o,i)=>`<button class="bonus-opt-btn" data-idx="${i}" aria-label="Option: ${o}">${o}</button>`).join('');
document.getElementById('bonusModal').innerHTML=`
<div class="bonus-header"><div class="bonus-title">⚠️ ${t('bonusTitle')} ⚠️</div><div class="bonus-warning">${t('bonusWarning')}</div></div>
<div class="bonus-progress">${dots}</div>
<div class="modal-tag">${c[cat].icon} ${c[cat].name} — ${bonusIndex+1}/${bonusPool.length}</div>
<div class="bonus-timer" id="bonusTimer">${bonusTimeLeft}</div>
<div class="modal-question">${q.q}</div>
<div class="${q.opts.length===3?'options opts-triple':'options'}">${optBtns}</div>`;
document.querySelectorAll('.bonus-opt-btn').forEach(btn=>{
btn.addEventListener('click',()=>bonusAnswer(+btn.dataset.idx));
});
if(bonusTimerInterval)clearInterval(bonusTimerInterval);
bonusTimerInterval=setInterval(()=>{
bonusTimeLeft--;
const el=document.getElementById('bonusTimer');
if(el){el.textContent=bonusTimeLeft;if(bonusTimeLeft<=5)el.classList.add('danger');}
if(bonusTimeLeft<=0){clearInterval(bonusTimerInterval);bonusFail();}
},1000);
}
function bonusAnswer(idx){
clearInterval(bonusTimerInterval);
const {cat,row}=bonusPool[bonusIndex];
const q=qs(cat,row);
if(q.isTrick||idx!==q.correct){bonusFail();return;}
playCorrect();bonusIndex++;setTimeout(renderBonusQuestion,500);
}
function bonusFail(){
clearInterval(bonusTimerInterval);playLoss();
document.getElementById('bonusModal').innerHTML=`<div class="bonus-header"><div class="bonus-title">💀 ${t('bonusTimeUp')}</div></div><div class="result-box wrong" style="margin-top:1rem">${t('bonusFail')}</div><div class="btn-row"><button class="restart-btn" id="bonusRestartBtn">${t('restart')}</button></div>`;
document.getElementById('bonusRestartBtn').addEventListener('click',()=>location.reload());
setTimeout(()=>endGame(true),2500);
}
function bonusSuccess(){
playVictory();fireConfetti();
document.getElementById('bonusModal').innerHTML=`<div class="bonus-header"><div class="bonus-title" style="color:#4ade80">🌴 ${t('bonusSuccess')}</div><div class="bonus-warning" style="color:#bbf7d0">${t('bonusSuccessSub')}</div></div>`;
totalStrikes=Math.floor(STRIKE_LIMIT*.3);islandLost=false;renderDamage();
setTimeout(()=>{document.getElementById('bonusOverlay').style.display='none';bonusRoundActive=false;renderScoreboard();renderBoard();checkAllUsed();},2800);
}
/* ============================================================
END GAME + STATS
============================================================ */
function endGame(islandWasLost){
clearInterval(questionTimerInterval);clearInterval(bonusTimerInterval);
if(!islandWasLost){playVictory();fireConfetti();}
if(gameMode==='solo'){
const acc=soloCorrect+soloWrong>0?Math.round(soloCorrect/(soloCorrect+soloWrong)*100):0;
document.getElementById('winBanner').innerHTML=`<div class="${islandWasLost?'loss-banner':'win-banner'}">${islandWasLost?'💀 Island lost!':'🏆 Challenge complete!'}<br><span style="font-size:16px">Score: ${soloScore} pts · Accuracy: ${acc}%</span><br><span style="font-size:13px;opacity:.8">${t('finalLine')}</span><div class="btn-row"><button class="restart-btn" id="viewStatsBtn">${t('viewStats')}</button></div></div>`;
document.getElementById('viewStatsBtn').addEventListener('click',showStats);
return;
}
const max=Math.max(...scores),winners=TEAMS.filter((_,i)=>scores[i]===max);
const html=islandWasLost
?`<div class="loss-banner">💀 Island lost — game over!<br><span style="font-size:16px">${winners.join(' & ')} ${winners.length>1?'were':'was'} leading with ${max} ${t('pts')}</span><br><span style="font-size:13px;opacity:.8">${t('finalLine')}</span><div class="btn-row"><button class="restart-btn" id="viewStatsBtn">${t('viewStats')}</button></div></div>`
:`<div class="win-banner">🏆 ${t('gameOver')}<br>${winners.join(' & ')} ${winners.length>1?t('winsWithPlural'):t('winsWith')} ${max} ${t('pts')}!<br><span style="font-size:13px;color:#9fd8c4;font-weight:400">${t('finalLine')}</span><div class="btn-row"><button class="restart-btn" id="viewStatsBtn">${t('viewStats')}</button></div></div>`;
document.getElementById('winBanner').innerHTML=html;
document.getElementById('viewStatsBtn').addEventListener('click',showStats);
}
function showStats(){
const max=Math.max(...scores),mvpIdx=scores.indexOf(max);
let tc=0,tw=0,ts=0;teamStats.forEach(s=>{tc+=s.correct;tw+=s.wrong;ts+=s.skipped;});
const cw=costliestWrong?`${costliestWrong.team} — ${costliestWrong.points} ${t('pts')} (${costliestWrong.category})`:'—';
let inner='';
if(gameMode==='solo'){
const acc=soloCorrect+soloWrong>0?Math.round(soloCorrect/(soloCorrect+soloWrong)*100):0;
inner=`<div class="stats-grid" style="grid-template-columns:1fr"><div class="stat-team-card winner"><div class="stat-team-name" style="color:#ffd23f">Your results</div><div class="stat-row"><span>Final score</span><span>${soloScore}</span></div><div class="stat-row"><span>${t('teamAccuracy')}</span><span>${acc}%</span></div><div class="stat-row"><span>${t('teamCorrect')}</span><span>${soloCorrect}</span></div><div class="stat-row"><span>${t('teamWrong')}</span><span>${soloWrong}</span></div><div class="stat-row"><span>${t('islandStatus')}</span><span>${islandLost?t('lost'):t('saved')}</span></div><div class="stat-row"><span>${t('costliest')}</span><span>${cw}</span></div></div></div>`;
} else {
const cards=TEAMS.map((team,i)=>{const s=teamStats[i],att=s.correct+s.wrong,acc=att>0?Math.round(s.correct/att*100):0;return `<div class="stat-team-card ${i===mvpIdx?'winner':''}"><div class="stat-team-name" style="color:${TEAM_COLORS[i]}">${team} ${i===mvpIdx?'👑':''}</div><div class="stat-row"><span>${t('teamAccuracy')}</span><span>${acc}%</span></div><div class="stat-row"><span>${t('teamCorrect')}</span><span>${s.correct}</span></div><div class="stat-row"><span>${t('teamWrong')}</span><span>${s.wrong}</span></div><div class="stat-row"><span>${t('teamSkipped')}</span><span>${s.skipped}</span></div><div class="stat-row"><span>${t('points')}</span><span>${scores[i]}</span></div></div>`;}).join('');
inner=`<div class="mvp-banner">🏆 ${t('mvp')}: ${TEAMS[mvpIdx]}</div><div class="stats-grid">${cards}</div><div class="overall-stats"><div class="row"><span>${t('totalQuestions')}</span><span>20</span></div><div class="row"><span>${t('totalCorrect')}</span><span>${tc}</span></div><div class="row"><span>${t('totalWrong')}</span><span>${tw}</span></div><div class="row"><span>${t('totalSkipped')}</span><span>${ts}</span></div><div class="row"><span>${t('islandStatus')}</span><span>${islandLost?t('lost'):t('saved')}</span></div><div class="row"><span>${t('costliest')}</span><span>${cw}</span></div></div>`;
}
const breakdown=buildBreakdownHTML();
document.getElementById('statsScreen').innerHTML=`<div class="stats-screen"><div class="stats-title">📊 ${t('statsTitle')}</div>${inner}${breakdown}<div class="btn-row"><button class="restart-btn" id="downloadJsonBtn">⬇️ Download results (JSON)</button><button class="restart-btn" id="downloadCsvBtn">⬇️ Download results (CSV)</button><button class="restart-btn" id="restartFinalBtn">${t('restart')}</button></div></div>`;
document.getElementById('restartFinalBtn').addEventListener('click',()=>location.reload());
document.getElementById('downloadJsonBtn').addEventListener('click',downloadResultsJSON);
document.getElementById('downloadCsvBtn').addEventListener('click',downloadResultsCSV);
document.getElementById('statsScreen').scrollIntoView({behavior:'smooth'});
}
/* ============================================================
DETAILED BREAKDOWN + RESULT EXPORT (for research / gap analysis)
============================================================ */
function buildBreakdownHTML(){
if(!answerLog.length)return '';
const catStats={};
answerLog.forEach(e=>{
const key=e.categoryEn||e.category;
if(!catStats[key])catStats[key]={correct:0,total:0,label:e.category};
catStats[key].total++;
if(e.isCorrect)catStats[key].correct++;
});
const catRows=Object.values(catStats).map(c=>{
const pct=c.total>0?Math.round(c.correct/c.total*100):0;
return `<div class="row"><span>${c.label}</span><span>${c.correct}/${c.total} (${pct}%)</span></div>`;
}).join('');
const items=answerLog.map(e=>{
const icon=e.isCorrect?'✅':'❌';
const whoLabel=e.who?`<span style="color:#8fb8cc">${e.who} · </span>`:'';
const chosen=(e.chosenText===null||e.chosenText===undefined)?'<em>No answer (time ran out)</em>':e.chosenText;
return `<div class="breakdown-item ${e.isCorrect?'bi-correct':'bi-wrong'}">
<div class="bi-head">${icon} ${whoLabel}<strong>${e.category}</strong> · ${e.points} ${t('pts')}</div>
<div class="bi-q">${e.question}</div>
<div class="bi-a">Answer given: ${chosen}</div>
${e.isCorrect?'':`<div class="bi-correct-answer">Correct answer: ${e.correctText}</div>`}
</div>`;
}).join('');
return `<div class="breakdown-section">
<div class="stats-title" style="font-size:16px;margin-top:1.5rem">📚 Accuracy by category</div>
<div class="overall-stats">${catRows}</div>
<div class="stats-title" style="font-size:16px;margin-top:1.5rem">📝 Full answer breakdown</div>
<div class="breakdown-list">${items}</div>
</div>`;
}
function resultsToObject(){
return {
sessionId,mode:gameMode,language:currentLang,generatedAt:new Date().toISOString(),
islandStatus:islandLost?'lost':'saved',
scores:gameMode==='team'?scores:undefined,
soloScore:gameMode==='solo'?soloScore:undefined,
answers:answerLog
};
}
function triggerDownload(content,mime,filename){
const blob=new Blob([content],{type:mime});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=filename;
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadResultsJSON(){
triggerDownload(JSON.stringify(resultsToObject(),null,2),'application/json',`semakau-results-${sessionId}.json`);
}
function csvEscape(s){if(s===null||s===undefined)return '';const str=String(s).replace(/"/g,'""');return /[",\n]/.test(str)?`"${str}"`:str;}
function downloadResultsCSV(){
const headers=['sessionId','mode','language','who','category','points','question','options','correctAnswer','yourAnswer','isCorrect','reason','timestamp'];
const rows=answerLog.map(e=>[e.sessionId,e.mode,e.language,e.who||'',e.category,e.points,e.question,e.options.join(' | '),e.correctText,e.chosenText===null?'(no answer)':e.chosenText,e.isCorrect?'1':'0',e.reason,e.timestamp]);
const csv=[headers.join(',')].concat(rows.map(r=>r.map(csvEscape).join(','))).join('\n');
triggerDownload(csv,'text/csv',`semakau-results-${sessionId}.csv`);
}
</script>
</body>
</html>
